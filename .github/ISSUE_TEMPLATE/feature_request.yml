name: Feature request
description: Suggest something Roost should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you'd like Roost to handle it. A rough idea is fine.
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do now instead?
      description: Workarounds or other tools you use for this today.
