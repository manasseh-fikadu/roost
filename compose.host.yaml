# Bield using the Tailscale that already runs on this machine (host mode). It
# shows up on the tailnet as this machine, at port 4700 on its tailnet IPs. See
# docs/docker.md.
#
#   docker compose -f compose.host.yaml up -d
#
# It reads BIELD_ADMINS (see docs/tailscale.md#admins-and-viewers) and
# BIELD_PORT from a .env file next to this one.
services:
  bield:
    image: ghcr.io/manasseh-fikadu/bield:latest
    restart: unless-stopped
    # Bield listens on the machine's tailnet IPs, which only the host's network
    # has.
    network_mode: host
    # The processes of this machine, not just the container's.
    pid: host
    environment:
      BIELD_TAILSCALE: host
      BIELD_PORT: ${BIELD_PORT:-4700}
      BIELD_ADMINS: ${BIELD_ADMINS:-}
    volumes:
      - bield-data:/data
      # The directory, not tailscaled.sock itself: tailscaled makes a new socket
      # when it restarts, and a mount of the old one would stay dead.
      - /var/run/tailscale:/var/run/tailscale
      # Uncomment to manage this machine's containers from Bield, with the
      # socket's group in group_add. See compose.yaml for the catch.
      # - /var/run/docker.sock:/var/run/docker.sock
    # group_add: ["999"]

    # Host mode has no setup page to ask, which is what the image's check does.
    healthcheck:
      disable: true

volumes:
  bield-data:
