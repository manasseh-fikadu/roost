# Roost as its own machine on your tailnet (embedded mode), the way to run it
# in Docker unless this machine already runs Tailscale. See docs/docker.md.
#
#   docker compose up -d
#   docker compose logs roost     # the link to log Roost in to Tailscale
#
# To skip the login link, put an auth key in a .env file next to this one:
#   TS_AUTHKEY=tskey-auth-...
# Roost only uses it the first time it starts. It also reads ROOST_ADMINS (see
# docs/tailscale.md#admins-and-viewers) and ROOST_HOSTNAME from there.
services:
  roost:
    image: ghcr.io/manasseh-fikadu/roost:latest
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      ROOST_ADMINS: ${ROOST_ADMINS:-}
      ROOST_HOSTNAME: ${ROOST_HOSTNAME:-roost}
    volumes:
      # Roost's database, and its Tailscale node and SSH key.
      - roost-data:/data
      # Uncomment to manage this machine's containers from Roost. This isn't
      # read-only in effect, whatever the :ro says: whoever can use the Docker
      # API can start a container that owns this machine, and Roost's admins can
      # use it. The container's user needs the socket's group too, so give
      # `stat -c %g /var/run/docker.sock` in group_add.
      # - /var/run/docker.sock:/var/run/docker.sock
    # group_add: ["999"]

    # To measure this machine, not the container, see "Measuring the host" in
    # docs/docker.md.

volumes:
  roost-data:
