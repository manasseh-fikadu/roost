version: "2"

linters:
  # The standard set (errcheck, govet, ineffassign, staticcheck, unused) plus these.
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - copyloopvar
    - dupword
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - gocritic
    - gosec
    - loggercheck
    - misspell
    - modernize
    - nilerr
    - noctx
    - nolintlint
    - perfsprint
    - predeclared
    - reassign
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
  settings:
    errcheck:
      check-type-assertions: true
    exhaustive:
      default-signifies-exhaustive: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: true
    sloglint:
      kv-only: true
      key-naming-case: snake
  exclusions:
    generated: strict
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/manasseh-fikadu/roost
