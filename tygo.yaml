# Generates TypeScript for the API's types. Run `make types` after changing them.
packages:
  - path: github.com/manasseh-fikadu/roost/internal/api
    output_path: web/src/lib/api/types.ts
    include_files:
      - types.go
    # A typed Go constant set, such as Role, becomes a union of its values.
    enum_style: union
    type_mappings:
      time.Time: "string /* RFC 3339 */"
